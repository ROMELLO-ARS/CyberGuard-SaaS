services:
  cyberguard-postgres:
    image: postgres:16
    container_name: cyberguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cyberguard
      POSTGRES_PASSWORD: CyberGuard123
      POSTGRES_DB: cyberguard_db
    ports:
      - "5432:5432"
    volumes:
      - cyberguard_postgres_data:/var/lib/postgresql/data

volumes:
  cyberguard_postgres_data: